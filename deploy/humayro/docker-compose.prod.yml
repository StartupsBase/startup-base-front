services:
  app:
    image: ${HUMAYRO_IMAGE:?HUMAYRO_IMAGE must reference an immutable image}
    container_name: humayro-front
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${HUMAYRO_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok && r.status !== 307 && r.status !== 308) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
