name: Humayro CI/CD

on:
  pull_request:
    paths:
      - ".github/workflows/humayro.yml"
      - ".dockerignore"
      - "apps/humayro/**"
      - "deploy/humayro/**"
      - "packages/ui/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/humayro.yml"
      - ".dockerignore"
      - "apps/humayro/**"
      - "deploy/humayro/**"
      - "packages/ui/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humayro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.HUMAYRO_API_URL || 'https://swagger.humayro.uz' }}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${{ secrets.HUMAYRO_YANDEX_MAPS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Humayro
        run: pnpm --filter humayro lint

      - name: Typecheck Humayro
        run: pnpm --filter humayro typecheck

      - name: Build Humayro
        run: pnpm --filter humayro build

  image:
    name: Publish container image
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image-name
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/humayro-front" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/humayro/Dockerfile
          push: true
          tags: ${{ steps.image-name.outputs.value }}:${{ github.sha }}
          cache-from: type=gha,scope=humayro
          cache-to: type=gha,mode=max,scope=humayro
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.HUMAYRO_API_URL || 'https://swagger.humayro.uz' }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ secrets.HUMAYRO_YANDEX_MAPS_API_KEY }}
            DEPLOYMENT_VERSION=${{ github.sha }}

      - name: Capture immutable image reference
        id: reference
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "value=${IMAGE_NAME}@${IMAGE_DIGEST}" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy to humayro.uz
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://humayro.uz
    env:
      DEPLOY_HOST: ${{ secrets.HUMAYRO_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.HUMAYRO_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.HUMAYRO_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.HUMAYRO_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.HUMAYRO_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.HUMAYRO_DEPLOY_PATH || 'humayro' }}
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          : "${DEPLOY_HOST:?Missing HUMAYRO_DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing HUMAYRO_DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing HUMAYRO_DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing HUMAYRO_DEPLOY_KNOWN_HOSTS secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/humayro_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/humayro_deploy ~/.ssh/known_hosts

      - name: Copy deployment manifests
        shell: bash
        run: |
          ssh -i ~/.ssh/humayro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/humayro_deploy -P "$DEPLOY_PORT" \
            deploy/humayro/docker-compose.prod.yml \
            deploy/humayro/deploy.sh \
            deploy/humayro/nginx.conf \
            deploy/humayro/nginx-http.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Pull and deploy image
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/humayro_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/humayro_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && HUMAYRO_IMAGE='$IMAGE_REFERENCE' bash deploy.sh"
